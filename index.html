/* Layout: app de aula no sistema Liquid Glass do manual Dr. Sérgio Vasconcelos — fundo menta, superfícies de vidro, verde dominante, rosa pontual; esquemas de eco em painéis escuros (imagem de ultrassom). */
:root {
  --bg: #F4FAF8; --bg-a: #dff1ec; --bg-b: #f3ecef;
  --glass: rgba(255,255,255,.55); --glass-2: rgba(255,255,255,.72); --glass-b: rgba(255,255,255,.75); --glass-hi: rgba(255,255,255,.85);
  --fg: #21342F; --fg-2: #2e5249; --muted: #52665f; --faint: #888A8A; --line: rgba(33,52,47,.12); --line2: rgba(33,52,47,.18);
  --green: #2E826A; --green-d: #1F6552; --teal: #68C0B7; --teal-d: #429790; --rose: #CB778F; --salmon: #F5A6A1; --mint: #E9F7F3;
  --on-green: #ffffff; --shadow: 0 12px 40px rgba(32,105,83,.12);
  --monitor: #0b1512; --monitor-b: #21342f;
  --red: #ef4c55; --blue: #4b8dff; --violet: #a77bea; --amber: #f2c14e;
  --f-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Roboto, system-ui, sans-serif;
  --f-brand: 'Kirvy', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --f-sign: 'Collabro', 'Brush Script MT', cursive;
  --f-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0E1A17; --bg-a: #10211c; --bg-b: #160f13;
  --glass: rgba(255,255,255,.08); --glass-2: rgba(255,255,255,.11); --glass-b: rgba(255,255,255,.12); --glass-hi: rgba(255,255,255,.14);
  --fg: #EAF3F0; --fg-2: #cfe0da; --muted: #9db8b0; --faint: #7a8a85; --line: rgba(255,255,255,.10); --line2: rgba(255,255,255,.16);
  --green: #5FC8B3; --green-d: #7fd3c6; --teal: #68C0B7; --teal-d: #7fd3c6; --rose: #f0a3b8; --salmon: #F5A6A1; --mint: #13211c;
  --on-green: #0b1512; --shadow: 0 12px 40px rgba(0,0,0,.35);
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-ui); font-size: 15px; line-height: 1.5; margin: 0; min-height: 100%;
  background: radial-gradient(60% 50% at 0% 0%, var(--bg-a), transparent 70%), radial-gradient(50% 40% at 100% 100%, var(--bg-b), transparent 70%), var(--bg); background-attachment: fixed;
  transition: background-color .3s, color .3s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; }

/* ---------- Motor da apresentação ---------- */
const GRUPOS = {
  A: { nome: 'Obstrução esquerda', sub: 'Circulação sistêmica ducto-dependente', cor: 'var(--rose)' },
  B: { nome: 'Conotruncais e circulações em paralelo', sub: 'Relação ventrículo-arterial anormal', cor: 'var(--green)' },
  C: { nome: 'Obstrução direita', sub: 'Circulação pulmonar ducto-dependente', cor: 'var(--teal-d)' },
  D: { nome: 'Retorno venoso pulmonar anômalo', sub: 'Obstrução pós-capilar', cor: 'var(--teal)' },
  E: { nome: 'Conexões AV e coração univentricular', sub: 'Septação AV, ventrículo único e situs', cor: 'var(--salmon)' }
};
const TEMPO = [2, 4, 4, 6, 6, 4, 3, 3, 3, 3, 2, 0];
const NOMES_SLIDE = ['Capa', 'Embriologia', 'Conceito', 'Esquemas', 'Achados por corte', 'Gravidade', 'Diferenciais', 'Genética', 'Parto', 'Pós-natal', 'Pérolas e laudo', 'Referências'];

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const ul = (arr, cls = '') => `<ul class="${cls}">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;

/* ----- blocos ----- */
let BLOCOS = [];
function montarBlocos() {
  BLOCOS = [{ id: 'abertura', tipo: 'abertura', nome: 'Abertura', sigla: 'Abertura', grupo: null, slides: ABERTURA.length }];
  LESOES.forEach(l => BLOCOS.push({ id: l.id, tipo: 'lesao', nome: l.nome, sigla: l.sigla, grupo: l.grupo, L: l, slides: 12 }));
}

/* ----- moldura comum ----- */
function chrome(b, idx, total, inner, extra = '') {
  const num = BLOCOS.indexOf(b);
  const g = b.grupo ? GRUPOS[b.grupo] : null;
  const label = b.tipo === 'lesao' ? NOMES_SLIDE[idx] : (ABERTURA[idx].rot || '');
  return `<div class="slide ${extra}" style="--gc:${g ? g.cor : 'var(--green)'}">
    <header class="s-top"><span class="s-eyebrow"><b>${num === 0 ? 'Abertura' : 'Bloco ' + String(num).padStart(2, '0')}</b>${num === 0 ? ' · Módulo de cardiopatias críticas' : ' · ' + esc(b.sigla)}${g ? ' · ' + esc(g.nome) : ''}</span><span class="s-brand"><i aria-hidden="true"></i><b>Dr. <span>Sérgio Vasconcelos</span></b></span></header>
    <div class="s-body">${inner}</div>
    <footer class="s-foot"><span>${esc(label)}</span><span class="s-prog">${Array.from({ length: total }, (_, i) => `<i class="${i === idx ? 'on' : i < idx ? 'done' : ''}"></i>`).join('')}</span><span>${idx + 1} / ${total}</span></footer>
  </div>`;
}

/* ----- slides de cada lesão ----- */
function timeline(j) {
  const min = 3, max = 12, w = 100 / (max - min);
  let ticks = '';
  for (let s = min; s <= max; s++) ticks += `<span style="left:${(s - min) * w}%">${s}</span>`;
  return `<div class="tl"><div class="tl-track"><div class="tl-win" style="left:${(j[0] - min) * w}%;width:${(j[1] - j[0]) * w}%"></div></div><div class="tl-ticks">${ticks}</div><div class="tl-cap">semanas pós-concepção · janela crítica ${j[0]}ª–${j[1]}ª</div></div>`;
}
function esquemas(L, normal) {
  const e = L.esq;
  const c4 = normal ? draw4C({}, {}) : draw4C(e.c4, { callouts: e.c4call });
  const v3 = normal ? draw3VT({}, {}) : draw3VT(e.v3, { callouts: e.v3call });
  const ot = normal ? drawOT('normal') : drawOT(e.ot, { callouts: e.otcall });
  return `<div class="esq-grid ${normal ? 'is-normal' : ''}">
    <figure><div class="fig">${c4}</div><figcaption><b>4 câmaras</b>${normal ? 'Referência normal' : esc(L.cortes[0][1].split('.')[0])}</figcaption></figure>
    <figure><div class="fig">${ot}</div><figcaption><b>Vias de saída</b>${esc(OTNOTE[normal ? 'normal' : e.ot] || '')}</figcaption></figure>
    <figure><div class="fig">${v3}</div><figcaption><b>3 vasos e traqueia</b>${normal ? 'Sinal do V: Ao e canal convergem à esquerda da traqueia' : esc((L.cortes.find(c => /3 vasos/.test(c[0])) || ['', ''])[1].split('.')[0])}</figcaption></figure>
  </div>
  <div class="legend"><span><i style="background:var(--red)"></i>fluxo em direção ao transdutor / anterógrado</span><span><i style="background:var(--blue)"></i>fluxo reverso / afastando-se</span><span><i style="background:var(--violet)"></i>shunt / mistura</span><span><i class="dash"></i>achado-chave</span><button class="tog" data-act="normal">${normal ? 'Mostrar a lesão' : 'Comparar com normal'}</button></div>`;
}

      h = `<h2>Gravidade e seguimento</h2><div class="two"><div><h3 class="red">Sinais de gravidade</h3>${ul(L.gravidade.sinais, 'flags')}</div><div><h3>Seguimento fetal</h3>${ul(L.gravidade.seguimento, 'steps')}</div></div>`; break;
    case 6:
      h = `<h2>Diagnóstico diferencial</h2><table class="tbl dif"><thead><tr><th>Confunde com</th><th>Como diferenciar</th></tr></thead><tbody>${L.difs.map(d => `<tr><th>${esc(d[0])}</th><td>${esc(d[1])}</td></tr>`).join('')}</tbody></table>`; break;
    case 7:
      h = `<h2>Associações e aconselhamento</h2><div class="three"><div class="card"><span class="lab">Genéticas</span>${ul(L.assoc.gen, 'bul')}</div><div class="card"><span class="lab">Extracardíacas</span>${ul(L.assoc.extra, 'bul')}</div><div class="card hi"><span class="lab">Conduta</span><p>${esc(L.assoc.conduta)}</p></div></div>`; break;
    case 8:
      h = `<h2>Planejamento do parto</h2><div class="kv">
        <div><span class="lab">Nível de cuidado</span><p>${esc(L.parto.nivel)}</p></div><div><span class="lab">Local</span><p>${esc(L.parto.local)}</p></div>
        <div><span class="lab">Momento</span><p>${esc(L.parto.momento)}</p></div><div><span class="lab">Via</span><p>${esc(L.parto.via)}</p></div></div>
        <h3>Sala de parto</h3>${ul(L.parto.sala, 'checks')}`; break;
    case 9:
      h = `<h2>Conduta pós-natal e cirurgia</h2><ol class="stages">${L.pos.etapas.map(e => `<li><span class="when">${esc(e[0])}</span><b>${esc(e[1])}</b><p>${esc(e[2])}</p></li>`).join('')}</ol><h3>Prognóstico</h3>${ul(L.pos.prog, 'bul cols')}`; break;
    case 10:
      h = `<h2>Pérolas, armadilhas e laudo</h2><div class="two"><div><h3 class="teal">Pérolas</h3>${ul(L.perolas, 'pearls')}<h3 class="red">Armadilhas</h3>${ul(L.armadilhas, 'traps')}</div>
      <div class="laudo"><span class="lab">Modelo de descrição e conclusão</span><p>${esc(L.laudo)}</p><button class="copy" data-act="copy">Copiar texto</button></div></div>`; break;
    case 11:
      h = `<h2>Referências do bloco</h2><div class="two"><div><h3>Fontes primárias no caderno 4</h3><ol class="refs">${L.fontes.map(f => `<li>${esc(FONTES[f])}</li>`).join('')}</ol></div>
      <div><h3>Vídeos CardioPedBrasil</h3><ul class="vids">${L.videos.map(v => `<li><a href="https://www.youtube.com/watch?v=${v}" target="_blank" rel="noopener">${esc(VIDEO[v] || v)}</a></li>`).join('')}</ul>
      <p class="note">Todos os itens estão no caderno "4. Enciclopédia de cardiopatias estruturais" do NotebookLM, que pode responder perguntas ancoradas nessas fontes.</p></div></div>`; break;
  }
  return chrome(b, i, 12, h, 'k' + i);
}

/* ----- abertura ----- */
function slideAbertura(b, i) {
  return chrome(b, i, ABERTURA.length, ABERTURA[i].html(), 'ab' + i);
}

/* ----- estado e navegação ----- */
const S = { b: 0, s: 0, normal: false };
function render() {
  const b = BLOCOS[S.b];
  const html = b.tipo === 'abertura' ? slideAbertura(b, S.s) : slideLesao(b, S.s, { normal: S.normal });
  const stage = document.getElementById('stage');
  stage.innerHTML = html;
  fit();
  document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('on', a.dataset.b == S.b));
  const sel = document.getElementById('blk'); if (sel) sel.value = S.b;
  document.getElementById('pos').textContent = `${S.s + 1} / ${b.slides}`;
  document.getElementById('dots').innerHTML = Array.from({ length: b.slides }, (_, i) => `<button class="dot ${i === S.s ? 'on' : ''}" data-s="${i}" title="${esc(b.tipo === 'lesao' ? NOMES_SLIDE[i] : ABERTURA[i].rot)}"><span>${esc(b.tipo === 'lesao' ? NOMES_SLIDE[i] : ABERTURA[i].rot)}</span></button>`).join('');
  try { localStorage.setItem('cc-pos', JSON.stringify({ b: S.b, s: S.s })); } catch (e) {}
  if (b.id && location.hash !== '#' + b.id) history.replaceState(null, '', '#' + b.id);
}
function fit() {
  const wrap = document.getElementById('stagewrap'), stage = document.getElementById('stage');
  const fs = document.fullscreenElement === wrap;
  const W = fs ? window.innerWidth : wrap.clientWidth, H = fs ? window.innerHeight : W * 9 / 16;
  const k = Math.min(W / 1280, H / 720);
  stage.style.transform = `translate(-50%,-50%) scale(${k})`;
  if (!fs) wrap.style.height = (720 * k) + 'px'; else wrap.style.height = '';
  // ajuste automático do corpo do slide
  const body = stage.querySelector('.s-body');
  if (body) {
    let f = body.closest('.k0,.k3,.ab0') ? 1 : 1.16; body.style.setProperty('--fz', f);
    while (body.scrollHeight > body.clientHeight + 2 && f > 0.66) { f -= 0.03; body.style.setProperty('--fz', f.toFixed(2)); }
  }
}
function go(db, ds) {
  if (db !== undefined) { S.b = Math.max(0, Math.min(BLOCOS.length - 1, db)); S.s = ds || 0; }
  render();
}
function next() { const b = BLOCOS[S.b]; if (S.s < b.slides - 1) S.s++; else if (S.b < BLOCOS.length - 1) { S.b++; S.s = 0; } S.normal = false; render(); }
function prev() { if (S.s > 0) S.s--; else if (S.b > 0) { S.b--; S.s = BLOCOS[S.b].slides - 1; } S.normal = false; render(); }

function navHTML() {
  let h = `<a class="nav-item" data-b="0" href="#abertura"><span class="n">00</span><span>Abertura do módulo</span></a>`;
  Object.keys(GRUPOS).forEach(k => {
    h += `<p class="nav-g" style="--gc:${GRUPOS[k].cor}">${esc(GRUPOS[k].nome)}</p>`;
    BLOCOS.forEach((b, i) => { if (b.grupo === k) h += `<a class="nav-item" data-b="${i}" href="#${b.id}"><span class="n">${String(i).padStart(2, '0')}</span><span>${esc(b.nome)}</span></a>`; });
  });
  return h;
}

const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function setTheme(t) { document.documentElement.setAttribute('data-theme', t); const b = document.getElementById('themeBtn'); if (b) { b.innerHTML = t === 'dark' ? SUN : MOON; b.setAttribute('aria-label', t === 'dark' ? 'Mudar para o tema claro' : 'Mudar para o tema escuro'); } try { localStorage.setItem('sv-theme', t); } catch (e) {} }
function init() {
  let th = 'light'; try { th = localStorage.getItem('sv-theme') || 'light'; } catch (e) {}
  setTheme(th);
  document.getElementById('themeBtn').addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
  montarBlocos();
  document.getElementById('nav').innerHTML = navHTML();
  document.getElementById('blk').innerHTML = BLOCOS.map((b, i) => `<option value="${i}">${String(i).padStart(2, '0')} · ${esc(b.nome)}</option>`).join('');
  const h = location.hash.slice(1);
  const bi = BLOCOS.findIndex(b => b.id === h);
  if (bi >= 0) S.b = bi; else { try { const p = JSON.parse(localStorage.getItem('cc-pos')); if (p && BLOCOS[p.b]) { S.b = p.b; S.s = Math.min(p.s, BLOCOS[p.b].slides - 1); } } catch (e) {} }
  document.addEventListener('click', e => {
    const a = e.target.closest('.nav-item'); if (a) { e.preventDefault(); S.normal = false; go(+a.dataset.b, 0); document.body.classList.remove('menu'); return; }
    const d = e.target.closest('.dot'); if (d) { S.s = +d.dataset.s; render(); return; }
    const t = e.target.closest('[data-act]'); if (!t) return;
    const act = t.dataset.act;
    if (act === 'next') next(); else if (act === 'prev') prev();
    else if (act === 'normal') { S.normal = !S.normal; render(); }
    else if (act === 'fs') { const w = document.getElementById('stagewrap'); if (document.fullscreenElement) document.exitFullscreen(); else if (w.requestFullscreen) w.requestFullscreen().catch(() => {}); }
    else if (act === 'menu') document.body.classList.toggle('menu');
    else if (act === 'goto') { S.normal = false; go(BLOCOS.findIndex(b => b.id === t.dataset.id), 0); }
    else if (act === 'copy') { const txt = t.previousElementSibling.textContent; const done = () => { t.textContent = 'Copiado'; setTimeout(() => t.textContent = 'Copiar texto', 1600); }; try { navigator.clipboard.writeText(txt).then(done, () => { selectText(t.previousElementSibling); t.textContent = 'Texto selecionado'; }); } catch (err) { selectText(t.previousElementSibling); } }
  });
  document.getElementById('blk').addEventListener('change', e => { S.normal = false; go(+e.target.value, 0); });
  document.addEventListener('keydown', e => {
    if (e.target.matches('input,select,textarea')) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); S.normal = false; go(S.b + 1, 0); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); S.normal = false; go(S.b - 1, 0); }
    else if (e.key.toLowerCase() === 'f') document.querySelector('[data-act=fs]').click();
    else if (e.key.toLowerCase() === 'n' && BLOCOS[S.b].tipo === 'lesao' && S.s === 3) { S.normal = !S.normal; render(); }
  });
  let tx = null;
  const wrap = document.getElementById('stagewrap');
  wrap.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  wrap.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) dx < 0 ? next() : prev(); tx = null; });
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  window.addEventListener('hashchange', () => { const i = BLOCOS.findIndex(b => b.id === location.hash.slice(1)); if (i >= 0 && i !== S.b) go(i, 0); });
  render();
}
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (BLOCOS.length) fit(); });
document.addEventListener('DOMContentLoaded', init);

</script>
